---
name: CI

"on":
  push:
    branches: [main, "alpha/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Public alpha release gate
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Toolchain identity
        run: |
          swift --version
          xcodebuild -version

      - name: Verify candidate
        run: bash scripts/verify_release.sh

  simulator-ui-tour:
    name: Simulator UI tour
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      E2E_DEVICE: iPhone 17 Pro
      E2E_DERIVED: ${{ runner.temp }}/videographr-e2e-derived
      E2E_SCREENSHOT_DIR: ${{ runner.temp }}/videographr-e2e-screenshots
      E2E_ARTIFACT_DIR: ${{ runner.temp }}/videographr-e2e-artifacts

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Toolchain identity
        run: |
          swift --version
          xcodebuild -version

      - name: Run assertion-backed UI tour
        run: bash scripts/run_e2e_screenshots.sh

      - name: Retain UI diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-ui-tour-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/videographr-e2e-artifacts
            ${{ runner.temp }}/videographr-e2e-screenshots
          if-no-files-found: warn
          retention-days: 14
