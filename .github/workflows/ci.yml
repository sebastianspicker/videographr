---
name: CI

"on":
  push:
    branches: [main, "alpha/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Public alpha release gate
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Toolchain identity
        run: |
          swift --version
          xcodebuild -version

      - name: Verify candidate
        run: bash scripts/verify_release.sh
